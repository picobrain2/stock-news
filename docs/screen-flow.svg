    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9a227"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f9e6b"/>
    </marker>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 28px/1.2 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #122033; }
      .sub { font: 500 14px/1.35 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #5b6b7c; }
      .h { font: 700 15px/1.2 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #122033; }
      .t { font: 500 13px/1.35 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2a3645; }
      .s { font: 500 12px/1.3 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #5b6b7c; }
      .label { font: 700 12px/1 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #5b6b7c; }
      .box { fill: #ffffff; stroke: #d5dde6; stroke-width: 1.5; }
      .box-side { fill: #f4f7fb; stroke: #c9d3df; stroke-width: 1.5; }
      .box-main { fill: #ffffff; stroke: #c9d3df; stroke-width: 1.5; }
      .box-action { fill: #fff8e8; stroke: #e6c76a; stroke-width: 1.5; }
      .box-data { fill: #eef8f2; stroke: #8dceb0; stroke-width: 1.5; }
      .box-poll { fill: #eef3ff; stroke: #9db0e0; stroke-width: 1.5; }
      .lane { fill: #f8fafc; stroke: #e4ebf2; stroke-width: 1.5; }
      .line { stroke: #5b6b7c; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-gold { stroke: #c9a227; stroke-width: 1.8; fill: none; marker-end: url(#arrow-gold); }
      .line-up { stroke: #2f9e6b; stroke-width: 1.8; fill: none; marker-end: url(#arrow-up); }
      .dash { stroke-dasharray: 5 4; }
